<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/FrontEnd/JefeDepartamento/CSS/Tickets.css">
    <link rel="stylesheet" href="/FrontEnd/Profesor/CSS/MenuDocente.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://unpkg.com/lucide@latest"></script>
    <title>Tickets</title>
</head>
<body>
    <main class="main-content">
        <div id="topbar"></div>
            <div class="tickets-admin">
                <!-- HEADER PRO -->
        <div class="page-header">
            <div>
                <h2>Tickets de Alumnos</h2>
            </div>
        

    <!-- FILTROS -->
    <div class="filtros">
        <select id="filtroEstado">
            <option value="todos">Todos</option>
            <option value="abierto">Abiertos</option>
            <option value="proceso">En proceso</option>
            <option value="resuelto">Resueltos</option>
        </select>

            <input type="text" id="busqueda" placeholder="Buscar por nombre o ID...">
    </div>
    </div>

    <!-- TABLA -->
    <table class="tabla-tickets">
        <thead>
            <tr>
                    <th>Remitente</th>
                <th>Problema</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>

        <tbody id="tablaTickets"></tbody>
    </table>

</div>
</main>

<!-- MODAL -->
<div class="modal" id="modalTicket">
    <div class="modal-content grande">

        <!-- BOTÓN CERRAR -->
        <span class="cerrar" onclick="cerrarModal()">×</span>

        <h3>Detalle del Ticket</h3>

        <div id="detalleTicket"></div>

        <!-- Nota: Oculto temporalmente ya que no hay columna en BD para respuesta -->
        <textarea id="respuesta" placeholder="Escribe la respuesta al alumno..." style="display:none;"></textarea>

        <div class="acciones-modal">
            <button class="btn-proceso" onclick="cambiarEstado('proceso')">En proceso</button>
            <button class="btn-resuelto" onclick="cambiarEstado('resuelto')">Resolver</button>
        </div>

    </div>
</div>
    <script src="/FrontEnd/JefeDepartamento/JS/Admin.js"></script>
    <script src="/FrontEnd/JefeDepartamento/JS/Tickets.js"></script>
    <script src="/FrontEnd/Profesor/JS/MenuDocente.js"></script>
</body>
</html>
