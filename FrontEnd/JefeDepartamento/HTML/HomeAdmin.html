<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin | ÁMBAR</title>
    <link rel="stylesheet" href="/FrontEnd/JefeDepartamento/CSS/Home.css">
    <link rel="stylesheet" href="/FrontEnd/Profesor/CSS/MenuDocente.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<main class="main-content">
    <div id="topbar"></div>
    <div class="dashboard">

    <!-- FILTROS GLOBALES -->
<div class="filtros-globales">
    <select id="filtroCarrera" onchange="filtrarDashboard()">
        <option value="todas">Todas las carreras</option>
        <option value="1">Ingeniería Informática</option>
        <option value="2">Ingeniería Industrial</option>
    </select>
</div>

    <!-- CARDS -->
    <div class="grid">

        <div class="card">
            <i data-lucide="users"></i>
            <div>
                <h3 id="totalAlumnos">0</h3>
                <p>Alumnos</p>
            </div>
        </div>

        <div class="card alerta">
            <i data-lucide="credit-card"></i>
            <div>
                <h3 id="pagosPendientes">0</h3>
                <p>Pagos pendientes</p>
            </div>
        </div>

        <div class="card alerta">
            <i data-lucide="award"></i>
            <div>
                <h3 id="creditosPendientes">0</h3>
                <p>Créditos por validar</p>
            </div>
        </div>

        <div class="card">
            <i data-lucide="ticket"></i>
            <div>
                <h3 id="tickets">0</h3>
                <p>Tickets abiertos</p>
            </div>
        </div>

    </div>

</div>
</main>
<script src="/FrontEnd/JefeDepartamento/JS/Admin.js"></script>
<script src="/FrontEnd/Profesor/JS/MenuDocente.js"></script>
<script src="/FrontEnd/JefeDepartamento/JS/Home.js"></script>
</body>
</html>
