<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="/FrontEnd/JefeDepartamento/CSS/Kardex.css">
    <link rel="stylesheet" href="/FrontEnd/Profesor/CSS/MenuDocente.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Kardex</title>
</head>
<body>

<main class="main-content">
    <div id="topbar"></div>

    <div class="kardex-admin">

        <!-- HEADER PRO -->
        <div class="page-header">
            <div>
                <h2>Gestión de Materias</h2>
            </div>
        

        <!-- FILTROS -->
        <div class="filtros">
            <select id="carrera">
                <option value="">Carrera</option>
            </select>

            <select id="semestre">
                <option value="">Semestre</option>
                <option value="1">1°</option>
                <option value="2">2°</option>
                <option value="3">3°</option>
                <option value="4">4°</option>
                <option value="5">5°</option>
                <option value="6">6°</option>
                <option value="7">7°</option>
                <option value="8">8°</option>
                <option value="9">9°</option>
            </select>

            <input type="text" id="busqueda" placeholder="Buscar materia...">
            <button class="btn-agregar" onclick="abrirModal()">
                + Agregar Materia
            </button>
        </div>
        </div>
        

        <!-- TABLA -->
        <table class="tabla-materias">
            <thead>
                <tr>
                    <th>Clave</th>
                    <th>Materia</th>
                    <th>Créditos</th>
                    <th>Unidades</th>
                    <th>Semestre</th>
                    <th>Carrera</th>
                    <th class="acciones-col">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>

    </div>
</main>

<!-- MODAL AGREGAR/EDITAR -->
<div class="modal" id="modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3 id="modal-titulo">Agregar Materia</h3>
            <button class="cerrar" onclick="cerrarModal()">✕</button>
        </div>

        <div class="modal-body">
            <label>Clave</label>
            <input type="text" id="claveMateria" readonly placeholder="Se genera automáticamente" style="background:#e2e8f0; cursor:not-allowed;">

            <label>Nombre de la materia</label>
            <input type="text" id="nombreMateria">

            <label>Créditos</label>
            <input type="number" id="creditosMateria">

            <label>Unidades de la Materia</label>
            <input type="number" id="unidadesMateria" min="1" max="6" value="6">

            <label>Semestre</label>
            <select id="semestreMateria">
                <option value="1">1°</option>
                <option value="2">2°</option>
                <option value="3">3°</option>
                <option value="4">4°</option>
                <option value="5">5°</option>
                <option value="6">6°</option>
                <option value="7">7°</option>
                <option value="8">8°</option>
                <option value="9">9°</option>
            </select>

            <label>Carrera a la que pertenece</label>
            <select id="carreraMateria">
                <option value="">Tronco Común (Todas)</option>
            </select>

            <label>Especialidad</label>
            <div style="display:flex; gap:10px;">
                <select id="especialidadMateria" style="flex:1; min-width:0; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
                    <option value="">Sin Especialidad</option>
                </select>
                <button onclick="abrirModalEspecialidad()" style="background:#f59e0b; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; font-weight:bold; flex-shrink:0;">+ Nueva</button>
            </div>

            <label>Materia Requisito (Seriación)</label>
            <select id="requisitoMateria">
                <option value="">Ninguna</option>
            </select>
        </div>

        <div class="acciones-modal">
            <button class="btn-guardar" onclick="guardarMateria()">Guardar</button>
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>

    </div>
</div>

<!-- MODAL ELIMINAR -->
<div class="modal" id="modalEliminar">
    <div class="modal-content modal-small">

        <h3>¿Eliminar materia?</h3>
        <p>Esta acción no se puede deshacer.</p>

        <div class="acciones-modal">
            <button class="btn-eliminar" onclick="confirmarEliminar()">Eliminar</button>
            <button class="btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
        </div>

    </div>
</div>

<!-- MODAL NUEVA ESPECIALIDAD -->
<div class="modal" id="modalEspecialidad">
    <div class="modal-content modal-small">
        <h3 style="margin-bottom:15px; color:#1a237e;">Crear Especialidad</h3>
        <input type="text" id="nombreNuevaEsp" placeholder="Ej. Desarrollo de Software" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:20px;">
        
        <div class="acciones-modal">
            <button class="btn-guardar" onclick="guardarEspecialidad()">Guardar</button>
            <button class="btn-cancelar" onclick="cerrarModalEspecialidad()">Cancelar</button>
        </div>
    </div>
</div>

<script src="/FrontEnd/JefeDepartamento/JS/Admin.js"></script>
<script src="/FrontEnd/JefeDepartamento/JS/Kardex.js"></script>
<script src="/FrontEnd/Profesor/JS/MenuDocente.js"></script>
</body>
</html>
