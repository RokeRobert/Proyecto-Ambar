<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="/FrontEnd/JefeDepartamento/CSS/Admin.css">
    <link rel="stylesheet" href="/FrontEnd/JefeDepartamento/CSS/Kardex.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <title>Kardex</title>
</head>
<body>

<div id="sidebar"></div>

<main class="main-content">
    <div id="topbar"></div>

    <div class="kardex-admin">

        <!-- HEADER PRO -->
        <div class="page-header">
            <div>
                <h2>Gestión de Materias</h2>
            </div>
        

        <!-- FILTROS -->
        <div class="filtros">
            <select id="carrera">
                <option value="">Carrera</option>
                <option value="info">Ingeniería Informática</option>
                <option value="ind">Industrial</option>
            </select>

            <select id="semestre">
                <option value="">Semestre</option>
                <option value="1">1°</option>
                <option value="2">2°</option>
                <option value="3">3°</option>
            </select>

            <input type="text" id="busqueda" placeholder="Buscar materia...">
            <button class="btn-agregar" onclick="abrirModal()">
                + Agregar Materia
            </button>
        </div>
        </div>
        

        <!-- TABLA -->
        <table class="tabla-materias">
            <thead>
                <tr>
                    <th>Clave</th>
                    <th>Materia</th>
                    <th>Créditos</th>
                    <th>Semestre</th>
                    <th class="acciones-col">Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>

    </div>
</main>

<!-- MODAL AGREGAR/EDITAR -->
<div class="modal" id="modal">
    <div class="modal-content">

        <div class="modal-header">
            <h3 id="modal-titulo">Agregar Materia</h3>
            <button class="cerrar" onclick="cerrarModal()">✕</button>
        </div>

        <div class="modal-body">
            <label>Clave</label>
            <input type="text" id="claveMateria" placeholder="Ej. INF101">

            <label>Nombre de la materia</label>
            <input type="text" id="nombreMateria">

            <label>Créditos</label>
            <input type="number" id="creditosMateria">

            <label>Semestre</label>
            <select id="semestreMateria">
                <option value="1">1°</option>
                <option value="2">2°</option>
                <option value="3">3°</option>
            </select>
        </div>

        <div class="acciones-modal">
            <button class="btn-guardar" onclick="guardarMateria()">Guardar</button>
            <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
        </div>

    </div>
</div>

<!-- MODAL ELIMINAR -->
<div class="modal" id="modalEliminar">
    <div class="modal-content modal-small">

        <h3>¿Eliminar materia?</h3>
        <p>Esta acción no se puede deshacer.</p>

        <div class="acciones-modal">
            <button class="btn-eliminar" onclick="confirmarEliminar()">Eliminar</button>
            <button class="btn-cancelar" onclick="cerrarModalEliminar()">Cancelar</button>
        </div>

    </div>
</div>

<script src="/FrontEnd/JefeDepartamento/JS/Kardex.js"></script>
<script src="/FrontEnd/JefeDepartamento/JS/Admin.js"></script>

</body>
</html>
